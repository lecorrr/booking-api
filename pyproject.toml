[project]
name = "booking-api"
version = "0.1.0"
description = "Book time slots without double bookings: Django REST API on PostgreSQL with Celery."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "Django>=6.1,<6.2",
    "djangorestframework>=3.18,<3.19",
    "djangorestframework-simplejwt>=5.5,<6",
    "drf-spectacular>=0.30,<0.31",
    "django-environ>=0.14,<0.15",
    "psycopg[binary]>=3.3,<3.4",
    "celery[redis]>=5.7,<5.8",
    "redis>=8.2,<9",
    "httpx>=0.28,<0.29",
    # Time zone data that does not depend on what the OS image ships.
    "tzdata>=2025.2",
    "whitenoise>=6.12,<7",
    "gunicorn>=27,<28",
]

[project.optional-dependencies]
dev = [
    "pytest>=9,<10",
    "pytest-django>=4.14,<5",
    "factory-boy>=3.3,<4",
    "ruff>=0.17,<0.18",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bookingapi*", "accounts*", "resources*", "bookings*", "webhooks*", "core*"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ", "SIM", "RUF"]
# Django and DRF are configured through mutable class attributes (fields, permission_classes).
ignore = ["RUF012"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "bookingapi.test_settings"
testpaths = ["tests"]
addopts = "-ra"
